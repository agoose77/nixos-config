# This example uses YAML anchors which allows reuse of multiple keys
# without having to repeat yourself.
# Also see https://github.com/Mic92/dotfiles/blob/d6114726d859df36ccaa32891c4963ae5717ef7f/nixos/.sops.yaml
# for a more complex example.
# This config block is not validated anywhere
keys:
  - users:
      - &angus ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM6KAmzdYW8JjiB5NXmq3NJAX/PP5DBOwhCWgu3ys0OP
  - hosts:
      - &nixos ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILbi13kW6EjJLhdVQKGZDsZkzsvoX5o+/bAHH6m2I3Ux
      - &hass ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHHHKUmWDp0SCLGPG5do3hjwZWJteS813n+8Us2bzLeL
      - &waldo ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJstm3nzmDAuTjJtMAS4s7qAg2AFLnFuwpDY94rzR6A2
creation_rules:
  - path_regex: ^modules/hosts/hass/secrets.ya?ml$
    key_groups:
      - age:
          - *angus
          - *hass
  - path_regex: ^modules/hosts/nixos/secrets.ya?ml$
    key_groups:
      - age:
          - *angus
          - *nixos
  - path_regex: ^modules/features/secrets.ya?ml$
    key_groups:
      - age: &all-keys
          - *angus
          - *nixos
          - *hass
          - *waldo
